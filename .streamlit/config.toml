# Streamlit theme for the Data Quality Dashboard.
#
# The palette is deliberately restrained: a near-white canvas, a single blue
# accent and three semantic colours.  Restraint matters because the app is
# mostly plots and tables, and strongly coloured chrome competes with the data.
# Every colour used in the charts in app.py is drawn from the same family, so
# the interface and the figures read as one system.
#
# Swap `base = "light"` for "dark" to get the dark appearance; the accent and
# semantic colours are chosen to hold up on both.

[theme]
base = "light"
baseFontSize = 15
baseRadius = "0.5rem"

# Surfaces: white cards on a faint grey canvas.
backgroundColor = "#F5F5F7"        # page canvas
secondaryBackgroundColor = "#FFFFFF"  # card / sidebar surface
grayBackgroundColor = "#EFEFF1"    # subtle inset panels
borderColor = "#D8D8DC"
dataframeBorderColor = "#E0E0E4"
dataframeHeaderBackgroundColor = "#F7F7F9"
showSidebarBorder = true
showWidgetBorder = false

# Text: near-black for body, grey for supporting copy.
primaryColor = "#1D1D1F"           # heading / strong text
textColor = "#1D1D1F"
grayColor = "#6E6E73"
grayTextColor = "#6E6E73"
headingFont = "sans-serif"
headingFontWeights = "600"
baseFontWeight = 400
metricValueFontSize = "1.65rem"
metricValueFontWeight = 600

# Accent: one blue for links, active tabs and focus rings.
blueColor = "#007AFF"
blueBackgroundColor = "#007AFF"
blueTextColor = "#FFFFFF"
linkColor = "#0057B8"

# Semantic colours, matched to the chart palette in app.py.  Each has a text
# variant readable on the light background.
redColor = "#FF3B30"               # fail / out of target
redBackgroundColor = "#FFECEB"
redTextColor = "#D70015"
greenColor = "#34C759"             # pass / within target
greenBackgroundColor = "#E7F7EC"
# Dark green text on a pale green background.  White text on the saturated
# #34C759 measured 2.22:1, below the WCAG AA 4.5:1 floor, so the background
# is tinted and the text uses this accessible dark green instead.
greenTextColor = "#1D7A34"
orangeColor = "#FF9F0A"            # attention
orangeBackgroundColor = "#FFF3DF"
orangeTextColor = "#B25000"
yellowColor = "#FF9F0A"
yellowBackgroundColor = "#FFF3DF"
yellowTextColor = "#B25000"
violetColor = "#AF52DE"
violetBackgroundColor = "#F3E8FB"
violetTextColor = "#8944AB"

# Chart palettes.  The categorical list matches SERIES_COLORS in app.py so the
# interactive charts and the exported figures use the same colours.
# Semantic green/amber/red stay out of the categorical list: categories use
# the blue ramp plus neutrals so status colours keep their meaning.
chartCategoricalColors = [
    "#007AFF", "#0057B8", "#66B5FF", "#5AC8FA",
    "#8E8E93", "#C7C7CC", "#AF52DE", "#E5E5EA",
]
chartSequentialColors = ["#E3F0FF", "#B3D9FF", "#66B5FF", "#007AFF", "#0055B8"]
# Status is carried by the single-hue bar plus its zero line in the app, so
# the diverging scale stays neutral here rather than reusing pass/fail hues.
chartDivergingColors = ["#0057B8", "#66B5FF", "#D2D2D7", "#C7C7CC", "#8E8E93"]

codeBackgroundColor = "#F5F5F7"
codeTextColor = "#1D1D1F"

[server]
# Keep the app responsive on smaller laptop screens.
headless = true
