[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data_quality"
version = "1.0.0"
description = "Data quality dashboard for WBS cost and progress data"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pandera>=0.17.0",
    "flask>=3.0.0",
    "streamlit>=1.28.0",
    "plotly>=5.17.0",
    "kagglehub>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["data_quality*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
